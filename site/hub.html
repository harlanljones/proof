<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baseball Analytics</title>
  <meta name="description" content="A portfolio of baseball analytics projects." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⚾</text></svg>" />
  <style>
    :root { --bg: #0e1117; --surface: #161b22; --border: #262c36; --text: #e6e6e6; --muted: #8b949e; --accent: #58a6ff; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    main { max-width: 720px; margin: 0 auto; padding: 4rem 2rem; }
    h1 { font-size: 1.75rem; margin: 0 0 0.5rem; }
    .sub { color: var(--muted); margin-bottom: 2.5rem; }
    .card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem 1.5rem; text-decoration: none; color: var(--text); margin-bottom: 1rem; transition: border-color .15s; }
    .card:hover { border-color: var(--accent); }
    .card h2 { margin: 0 0 0.35rem; font-size: 1.15rem; color: var(--accent); }
    .card p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Baseball Analytics</h1>
    <p class="sub">A portfolio of baseball analytics projects.</p>

    <a class="card" href="/proof/">
      <h2>PROOF — rest-of-season projections</h2>
      <p>Probabilistic rest-of-season wOBA / FIP leaderboards with 80% intervals.
        Empirical-Bayes blend of a Marcel prior and season-to-date performance.</p>
    </a>
  </main>
</body>
</html>
