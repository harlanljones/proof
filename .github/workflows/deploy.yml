name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily refresh during the MLB season (Mar-Sep). The dashboard is
    # "as of yesterday", so a mid-day UTC run lets overnight games settle.
    # Off-season runs would fail (no in-window season), so the window is
    # deliberately bounded to the regular-season months.
    - cron: "0 12 * 3-9 *"

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      # Regenerates dist-site/ (hub + /proof/ dashboard) and pulls any
      # missing data snapshots from Baseball-Reference (polite, ~2 requests).
      - name: Prerender static site
        run: uv run python prerender.py

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
